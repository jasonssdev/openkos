<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenKOS</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main>
      <h1>OpenKOS</h1>
      <section aria-labelledby="engine-heading">
        <h2 id="engine-heading">Engine</h2>
        <p id="engine-status" role="status">Starting the engine…</p>
        <pre id="engine-detail" hidden></pre>
      </section>
      <section aria-labelledby="workspace-heading">
        <h2 id="workspace-heading">Workspace</h2>
        <p id="workspace-message">Waiting for the engine.</p>
        <dl id="workspace-facts" hidden></dl>
      </section>
    </main>
  </body>
</html>
