[package]
name = "openkos-desktop"
version = "0.1.0"
description = "The OpenKOS desktop shell: supervises the engine as a sidecar."
license = "Apache-2.0"
repository = "https://github.com/jasonssdev/openkos"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "openkos_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# The system folder picker for the workspace, opened only from Rust (ADR-0071).
tauri-plugin-dialog = "2"
# The notification for a stopped inbox watch (ADR-0078), shown only from Rust
# with fixed text. Pinned to an exact version, and no capability gives the page
# a notification permission. The Windows 7 shim is off: only macOS ships.
tauri-plugin-notification = { version = "=2.6.0", default-features = false }
# The app's own signed updates (ADR-0079), checked and installed only from Rust,
# and only once the person confirms. Pinned to an exact version; the Windows
# and Linux archive formats (`zip`) are off: only macOS ships.
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The remote backend's API key lives in the login keychain (ADR-0070). Only
# macOS has a store; elsewhere the key commands answer "not supported".
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
keyring-core = "1"
