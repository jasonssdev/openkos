name: CI

# Pull requests into main are the merge gate (AGENTS.md: "nothing merges without
# green CI + review"); the push trigger keeps main's own history green after a
# merge or a direct push.
#
# Pull requests into a tracker/** branch are gated too. A large change is
# delivered as a chain of review-sized slices that stack onto a tracker branch,
# and only the tracker opens a pull request against main. Gating main alone would
# leave every slice unvalidated until the whole chain was already assembled --
# and the local loop cannot stand in for CI here, because the test matrix also
# runs 3.14 and the build job smoke-tests an isolated wheel. A slice that breaks
# either would stay hidden until the last pull request in the chain.
#
# There are deliberately no path filters. Docs-only changes touch nothing these
# jobs validate, but a job skipped by a path filter reports no status at all, and
# a required check that never reports blocks a pull request indefinitely. Running
# every change through the full suite keeps the branch-protection story simple
# and keeps the "green CI" claim honest. The jobs take seconds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'tracker/**']

# Least privilege. This is a public repository; no job here reads or writes
# repository state beyond checking the code out.
permissions:
  contents: read

# Supersede in-flight runs for the same pull request, but never cancel a run on
# main: every commit on the default branch keeps a status of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA rather than by moving tag: a tag can be
# repointed at new code, a SHA cannot. The trailing comment records the release
# each SHA corresponds to. Note that astral-sh/setup-uv publishes no moving major
# tag for its v8 series, so an exact reference is required there regardless.
jobs:
  # Ruff reads its target version from `project.requires-python` and MyPy pins
  # `python_version = "3.12"`, so both analyse for 3.12 whatever interpreter they
  # run on. Running them across the matrix would repeat identical work; they run
  # once, on the declared floor.
  quality:
    name: quality (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      # `--locked` installs exactly what uv.lock pins and fails if the lock has
      # drifted from pyproject.toml, so a dependency edit cannot merge unlocked.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # `--check` reports formatting instead of rewriting it; CONTRIBUTING.md
      # tells contributors to run `uv run ruff format .` locally to fix it.
      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

  # Only the test run genuinely varies by interpreter, so only it gets a matrix:
  # 3.12 is the declared floor, 3.14 is the current release. Ubuntu only for now.
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report every interpreter even when one fails. The difference between
      # "3.14 alone is red" and "all are red" is the whole reason the matrix
      # exists, and cancelling a sibling job hides it.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # `--cov` enables the coverage gate configured in pyproject.toml
      # ([tool.coverage.report] fail_under). The flag stays out of pytest's
      # addopts so plain local runs stay fast, and a local `uv run pytest --cov`
      # gates identically to this step.
      # This job collects `tests/smoke/` too, as part of the full suite, and
      # runs it against the EDITABLE install -- so it declares that, the
      # same way the cross-platform smoke job declares the wheel. Both
      # directions are asserted, which is what stops the provenance check
      # from being satisfiable by doing nothing.
      - name: Run tests with coverage
        env:
          OPENKOS_SMOKE_EXPECT_WHEEL: "0"
        run: uv run pytest --cov

  # The eval harnesses carry their own `--self-test` entry points, and until
  # #831 nothing ran them. Two were red — one since #754 gave the judge a retry,
  # one since #719 renamed a report label — for as long as it took someone to
  # run them by hand. A self-test nobody runs reads as a guarantee while
  # guaranteeing nothing, and does so exactly when a number from that harness
  # is being trusted.
  #
  # One interpreter, not the matrix: these check that a harness still agrees
  # with production, which is a property of the code and not of the runtime.
  # The whole sweep takes about two seconds because every self-test is
  # model-free by construction — and the runner poisons `OLLAMA_HOST` to a
  # closed port so that stays a check rather than a claim.
  self-tests:
    name: eval harness self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Harnesses are discovered, never listed: a checked-in list would leave a
      # new harness silently unguarded, which is the same rot this job exists to
      # catch. Discovering none is itself a failure.
      - name: Run harness self-tests
        run: uv run python evals/run_self_tests.py

  # Packaging is validated before any release exists: `uv build` exercises the
  # uv_build backend, and installing the wheel into an isolated environment
  # proves the artifact itself is sound (the console script resolves and runs)
  # — not just that the editable dev install happens to work.
  build:
    name: build (uv build + wheel smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      # A green build is not a legally complete distribution. Both artifacts
      # carried `License-Expression: Apache-2.0` while containing no LICENSE
      # file at all, which Apache-2.0 section 4 requires of every
      # redistribution (#924). Metadata cannot prove this -- only the archive
      # contents can -- so this step reads inside both artifacts rather than
      # trusting the backend to have honoured `license-files`.
      - name: License file ships in both artifacts
        run: |
          shopt -s nullglob
          sdists=(dist/openkos-*.tar.gz)
          wheels=(dist/openkos-*.whl)
          test "${#sdists[@]}" -eq 1 && test "${#wheels[@]}" -eq 1 || {
            echo "license check: expected exactly one sdist and one wheel" >&2
            exit 1
          }
          tar -tzf "${sdists[0]}" | grep -qx 'openkos-[^/]*/LICENSE' || {
            echo "::error::sdist ${sdists[0]} ships no LICENSE file" >&2
            exit 1
          }
          unzip -l "${wheels[0]}" | grep -qE 'openkos-[^/]*\.dist-info/licenses/LICENSE$' || {
            echo "::error::wheel ${wheels[0]} ships no LICENSE file" >&2
            exit 1
          }
          echo "LICENSE present in both the sdist and the wheel."

      # `--isolated --no-project` installs only the built wheel, so invoking
      # the console script exercises the artifact's own entry-point metadata
      # rather than the checkout or the dev environment.
      - name: Wheel smoke test
        run: |
          # Resolve the glob to exactly one wheel up front: with a stale second
          # wheel in `dist/`, an unquoted `--with dist/openkos-*.whl` would expand
          # to two arguments and fail with an unrelated-looking spawn error.
          # `nullglob` makes the no-wheel case collapse to an empty array so the
          # guard below reports it, instead of passing the literal pattern through.
          shopt -s nullglob
          wheels=(dist/openkos-*.whl)
          test "${#wheels[@]}" -eq 1 || {
            echo "wheel smoke test: expected exactly one wheel, found ${wheels[*]}" >&2
            exit 1
          }
          wheel="${wheels[0]}"
          uv run --isolated --no-project --with "$wheel" openkos --help
          # `--version` exits 0 even on its degraded `openkos unknown` fallback, so
          # asserting the exit status alone would let a wheel whose distribution
          # metadata is unreadable pass this step green. Compare the printed line
          # against the version in the built wheel's own filename instead -- that is
          # what makes this step proof the flag reads real packaged metadata.
          expected="openkos $(basename "$wheel" | cut -d- -f2)"
          actual=$(uv run --isolated --no-project --with "$wheel" openkos --version)
          test "$actual" = "$expected" || {
            echo "wheel smoke test: expected '$expected', got '$actual'" >&2
            exit 1
          }

      # The unit suite runs `init` against the editable install, where
      # `src/openkos/templates/` is just a directory on disk -- it would
      # stay green even if a packaging change silently dropped the
      # templates from the wheel. This step is the only proof the
      # templates actually ship: run `init` against the isolated wheel
      # itself and assert all five artifacts land.
      - name: Init smoke test (packaging proof for templates/)
        run: |
          workdir="$(mktemp -d)"
          cd "$workdir"
          uv run --isolated --no-project --with "${GITHUB_WORKSPACE}"/dist/openkos-*.whl openkos init
          test -d raw
          test -f bundle/index.md
          test -f bundle/log.md
          test -f openkos.yaml
          test -f AGENTS.md

  # Every job above runs on `ubuntu-latest` only. macOS and Windows behavior
  # is otherwise UNVERIFIED until a user hits it, and this repo has already
  # paid for that twice: platform-gated tests that first ran on Linux cost
  # two fix cycles on PR #492, and HFS+/SMB normalization differences
  # produced real graph-edge bugs (#430). A full suite times three
  # platforms on every PR is not warranted -- most of the suite exercises
  # platform-independent logic Linux already covers -- but zero
  # cross-platform signal is not acceptable either. This runs a REDUCED,
  # explicitly marked subset instead (`-m cross_platform_smoke`, defined in
  # `pyproject.toml`) that targets what Linux structurally cannot:
  # filesystem normalization, symlink/permission privilege boundaries, the
  # workspace lock's `fcntl`/`msvcrt` branches, SQLite WAL behavior, and
  # `init`/`ingest`/`doctor` against the packaged wheel.
  #
  # No path filter here either, for the same reason the top of this file
  # gives for the whole workflow: a job skipped by a path filter reports no
  # status at all, and a required check that never reports blocks a pull
  # request indefinitely. The subset is deliberately kept small (currently
  # ~30 tests, single-digit seconds) specifically so that running it on
  # EVERY pull request, unconditionally, stays cheap -- the same tradeoff
  # the top-of-file comment makes, applied at job scope instead of workflow
  # scope. Growing this marker into a second full suite would break that
  # tradeoff; see the marker's own registration comment in pyproject.toml.
  cross-platform-smoke:
    name: cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Report both platforms even when one fails -- same reasoning as the
      # `test` job's own matrix: a Windows-only red must never hide behind
      # a cancelled macOS run, or vice versa.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      # Dev dependencies (pytest, typer's test client, ...) plus an
      # EDITABLE `openkos` -- overwritten by the packaged wheel below.
      # Installing them first, separately, is what lets the wheel step
      # stay a plain single-package `uv pip install` rather than having to
      # reassemble the whole test-dependency set around an isolated wheel
      # install.
      - name: Install dependencies
        run: uv sync --locked

      - name: Build the wheel
        run: uv build

      # Overwrites the editable `openkos` with the WHEEL `uv build` just
      # produced, in the SAME environment pytest runs in below --
      # `--reinstall-package` touches only that one package, leaving
      # pytest/typer/etc. from the `uv sync` above untouched. This is the
      # "install the built wheel" this job exists to prove: every test
      # below now imports the packaged distribution, not the checkout --
      # the same concern the Linux `build` job's own wheel/init smoke
      # steps exist for, extended here to macOS/Windows packaging.
      #
      # `shell: bash` is explicit (Windows runners default to PowerShell,
      # which does not understand this syntax) -- the nullglob/array guard
      # mirrors the `build` job's own wheel-smoke-test step above, for the
      # same reason: an unquoted glob against a stale second wheel would
      # expand to two arguments and fail with an unrelated-looking error.
      - name: Install the built wheel over the editable dev install
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/openkos-*.whl)
          test "${#wheels[@]}" -eq 1 || {
            echo "cross-platform smoke: expected exactly one wheel, found ${wheels[*]}" >&2
            exit 1
          }
          uv pip install --reinstall-package openkos "${wheels[0]}"

      # `uv run` resyncs the project environment against `pyproject.toml`
      # before every invocation by default -- which would silently
      # reinstall the EDITABLE `openkos` over the wheel the previous step
      # just installed, undoing it without printing an error. `--no-sync`
      # is what makes the wheel install actually stick for this run
      # (confirmed empirically while writing this job: omitting the flag
      # reverts to the editable install before pytest even starts
      # collecting, silently).
      #
      # `-m cross_platform_smoke` selects the marked subset; pytest itself
      # is the guard against a false green here -- deselecting every test
      # (a typo'd marker name, or a future change that strips the last
      # marked test) makes pytest report "no tests collected" and exit 5,
      # not 0, so an empty subset FAILS this step rather than passing
      # having run nothing.
      # `OPENKOS_SMOKE_EXPECT_WHEEL=1` is what makes the wheel install above
      # self-verifying instead of load-bearing-but-unasserted: without it
      # every test in `tests/smoke/` would still pass against the editable
      # checkout if `--no-sync`, the reinstall, or the build regressed, and
      # this job would report green having proved nothing about packaging.
      # An unset declaration is a hard FAILURE under CI, never a skip --
      # see `test_the_openkos_under_test_is_the_declared_install`.
      - name: Cross-platform smoke subset
        shell: bash
        env:
          OPENKOS_SMOKE_EXPECT_WHEEL: "1"
        run: uv run --no-sync pytest -m cross_platform_smoke -v
